<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluixi Playground</title>
  </head>
  <body>
    <!-- The preview owns id="app": a project mounts into that, exactly as its own
         index.html says, so this root needs a name of its own. -->
    <div id="playground-root"></div>
    <!-- shim node globals the compiler/babel expect when bundled for the browser -->
    <script>
      window.global = window.global || window;
      window.process = window.process || { env: { NODE_ENV: 'development' } };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
