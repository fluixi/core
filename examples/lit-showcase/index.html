<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluixi · html`` feature showcase</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
      main { max-width: 760px; margin: 0 auto; padding: 2rem; }
      section { border: 1px solid #262a33; border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0; }
      h1 { font-size: 1.4rem; } h2 { font-size: 1rem; color: #8ab4f8; margin-top: 0; }
      button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: .35rem .7rem; cursor: pointer; }
      button + button { margin-left: .4rem; }
      input { background: #171a21; border: 1px solid #333; color: #eee; border-radius: 6px; padding: .3rem .5rem; }
      .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
      .tag { display: inline-block; padding: .1rem .5rem; border-radius: 999px; background: #222; font-size: .8rem; }
      .active { outline: 2px solid #3fb950; } .danger { color: #f85149; }
      ul { margin: .4rem 0; } li { margin: .1rem 0; }
      .box { padding: .4rem .6rem; border-radius: 6px; background: #171a21; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
