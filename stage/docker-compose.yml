services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: leuzman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-medusa-store}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - leuzman_network
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medusa-store}"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 15s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: leuzman_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - leuzman_network
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  # ── Medusa Backend ────────────────────────────────────────────────────────────
  medusa:
    build:
      # Build context is the monorepo root — Dockerfile.repo COPYs only what it needs.
      # Run from the repo root:  docker compose -f packages/kettle-apps/leuzman-backend/docker-compose.yml up
      # Or use the root docker-compose.yml which sets the correct context automatically.
      context: ../../../
      dockerfile: packages/kettle-apps/leuzman-backend/Dockerfile.repo
    container_name: leuzman_medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # These override env_file values so Docker networking works correctly.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa-store}
      REDIS_URL:    redis://redis:6379
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    networks:
      - leuzman_network

volumes:
  postgres_data:
    name: leuzman_postgres_data

networks:
  leuzman_network:
    name: leuzman_network
    driver: bridge
