# ──────────────────────────────────────────────────────────────────────────────
# Leuzman / MedusaJS — Full stack development + production compose
#
# Services:
#   core:       postgres, redis, medusa
#   workers:    erp-worker (BullMQ), pos-worker, barcode-worker
#   monitoring: prometheus, grafana, redis-exporter, postgres-exporter
#
# Usage:
#   dev:        docker compose up postgres redis medusa
#   full:       docker compose --profile workers --profile monitoring up
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: leuzman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-medusa-store}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - leuzman_network
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medusa-store}"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 15s

  # ── Redis (with persistence) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: leuzman_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - leuzman_network
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  # ── Medusa Backend ─────────────────────────────────────────────────────────────
  medusa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leuzman_medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - medusa_data:/var/lib/medusa
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa-store}
      REDIS_URL:    redis://redis:6379
      NODE_ENV:     ${NODE_ENV:-production}
      # Disable in-process BullMQ workers — dedicated worker containers handle queues
      DISABLE_ERP_WORKERS: "true"
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    networks:
      - leuzman_network
    healthcheck:
      test:         ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval:     15s
      timeout:      5s
      retries:      5
      start_period: 30s

  # ── ERP Worker (BullMQ: product, inventory, order, customer, invoice, DLQ) ───
  erp-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: leuzman_erp_worker
    restart: unless-stopped
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL:   postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa-store}
      REDIS_URL:      redis://redis:6379
      WORKER_MODE:    "erp"
      WORKER_QUEUES:  "medusa-odoo-product,medusa-odoo-inventory,medusa-odoo-order,medusa-odoo-customer,medusa-odoo-invoice,medusa-odoo-reconcile"
      NODE_ENV:       ${NODE_ENV:-production}
    networks:
      - leuzman_network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── POS Offline Replay Worker ─────────────────────────────────────────────────
  pos-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: leuzman_pos_worker
    restart: unless-stopped
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL:  postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa-store}
      REDIS_URL:     redis://redis:6379
      WORKER_MODE:   "pos"
      WORKER_QUEUES: "pos-offline-replay,pos-session-close"
      NODE_ENV:      ${NODE_ENV:-production}
    networks:
      - leuzman_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Barcode Cache Worker ──────────────────────────────────────────────────────
  barcode-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: leuzman_barcode_worker
    restart: unless-stopped
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL:  postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa-store}
      REDIS_URL:     redis://redis:6379
      WORKER_MODE:   "barcode"
      WORKER_QUEUES: "barcode-cache,barcode-scan-log"
      NODE_ENV:      ${NODE_ENV:-production}
    networks:
      - leuzman_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: leuzman_prometheus
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - leuzman_network

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: leuzman_grafana
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL:         ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/leuzman.json
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - leuzman_network

  # ── Redis Exporter (for Prometheus) ──────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: leuzman_redis_exporter
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - leuzman_network
    depends_on:
      - redis

  # ── PostgreSQL Exporter (for Prometheus) ──────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: leuzman_postgres_exporter
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa-store}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - leuzman_network
    depends_on:
      postgres:
        condition: service_healthy

  # ── BullMQ Board (queue UI) ───────────────────────────────────────────────────
  bullboard:
    image: deadly0/bull-board:latest
    container_name: leuzman_bullboard
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BULL_PREFIX: "bull"
    ports:
      - "${BULLBOARD_PORT:-3002}:3000"
    networks:
      - leuzman_network
    depends_on:
      - redis

volumes:
  postgres_data:
    name: leuzman_postgres_data
  redis_data:
    name: leuzman_redis_data
  medusa_data:
    name: leuzman_medusa_data
  prometheus_data:
    name: leuzman_prometheus_data
  grafana_data:
    name: leuzman_grafana_data

networks:
  leuzman_network:
    name: leuzman_network
    driver: bridge
