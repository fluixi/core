name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@fluixi'

      # @bambiste/mix-builder lives under a personal account, so the repo-scoped
      # GITHUB_TOKEN can't read it. PACKAGES_TOKEN is a PAT with read:packages
      # for both the @bambiste and @fluixi scopes; falls back to GITHUB_TOKEN.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: nrwl/nx-set-shas@v4

      # Build the publishable packages first (topological, via pnpm — no nx). The
      # example vite configs import @fluixi/vite-plugin, so nx can't load the
      # project graph until that package's dist exists; `nx affected` below would
      # otherwise fail at graph processing on a fresh checkout.
      - name: Build packages
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Build affected
        run: pnpm nx affected -t build --parallel=3
        env:
          NODE_ENV: production

      - name: Test affected
        run: pnpm nx affected -t test --parallel=3

      - name: Typecheck affected
        run: pnpm nx affected -t typecheck --parallel=3
