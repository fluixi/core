name: CI

on:
  push:
    branches: [main]
    # The package CI validates the publishable packages; changes that only touch the
    # apps (deployed by Cloudflare), docs, markdown, or changesets don't need it.
    paths-ignore:
      - '**/*.md'
      - '.changeset/**'
      - 'web/**'
      - 'docs/**'
      - 'my-portfolio/**'
      - 'playground/**'
      - '.vscode/**'
  pull_request:
    branches: [main, next, alpha]
    paths-ignore:
      - '**/*.md'
      - '.changeset/**'
      - 'web/**'
      - 'docs/**'
      - 'my-portfolio/**'
      - 'playground/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    # Skip the auto-generated "Version Packages" PR: its source is unchanged from the feature
    # PR that already passed, and release.yml re-gates it before publishing. Avoids a full
    # redundant Build & Test per release.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'changeset-release/') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@fluixi'

      # @bambiste/mix-builder lives under a personal account, so the repo-scoped
      # GITHUB_TOKEN can't read it. PACKAGES_TOKEN is a PAT with read:packages
      # for both the @bambiste and @fluixi scopes; falls back to GITHUB_TOKEN.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: nrwl/nx-set-shas@v4

      # Build the publishable packages first (topological, via pnpm — no nx). The
      # example vite configs import @fluixi/vite-plugin, so nx can't load the
      # project graph until that package's dist exists; `nx affected` below would
      # otherwise fail at graph processing on a fresh checkout.
      - name: Build packages
        run: pnpm run build
        env:
          NODE_ENV: production

      # Exclude the example apps from the build: they're consumer fixtures that pin
      # @fluixi/* to published dist-tags (not workspace:*), so e.g. @fluixi/example-start's
      # `fluixi build` can't find the CLI bin in CI ("fluixi: not found"). The publishable
      # packages are what the build must validate; examples are exercised via their tests.
      - name: Build affected
        run: pnpm nx affected -t build --parallel=3 --exclude=@fluixi/example-counter,@fluixi/example-router,@fluixi/example-todo,@fluixi/example-ssr,@fluixi/example-start,@fluixi/example-lit-counter,@fluixi/example-lit-showcase
        env:
          NODE_ENV: production

      # Examples use workspace:* deps, so their tests DO validate this PR's source —
      # they're real regression gates and stay IN. (Two known pre-existing failures are
      # `it.skip`-ped with tracking notes in the example specs, not hidden here.)
      # Only @fluixi/cli is excluded: it has a `test` script but no test files, so
      # `vitest run` exits 1.
      - name: Test affected
        run: pnpm nx affected -t test --parallel=3 --exclude=@fluixi/cli

      # The examples are vite/vitest regression fixtures (noEmit, non-composite), so
      # the inferred `tsc --build --emitDeclarationOnly` typecheck doesn't apply to
      # them (TS5069). They're type-exercised by their vitest runs instead.
      - name: Typecheck affected
        run: pnpm nx affected -t typecheck --parallel=3 --exclude=@fluixi/example-counter,@fluixi/example-router,@fluixi/example-todo,@fluixi/example-ssr,@fluixi/example-start,@fluixi/example-lit-counter,@fluixi/example-lit-showcase
