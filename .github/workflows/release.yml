name: Release

# Runs on every push to main (stable), next, and alpha (prerelease channels).
# - If there are pending changesets  → opens/updates a "Version Packages" PR
# - If the "Version Packages" PR was just merged → builds & publishes
# On `next`/`alpha`, changesets is in prerelease mode (.changeset/pre.json, tag
# `next`/`alpha`), so versions are `-next.X`/`-alpha.X`. `changeset publish` puts
# them on npm's `latest` tag; the "Advance prerelease dist-tag" step below then
# points the `alpha`/`next` dist-tag at them so `@fluixi/x@alpha` stays current.
on:
  push:
    branches: [main, next, alpha]
  # Manual fallback. A push is normally the trigger, but that depends on GitHub
  # delivering the event — during the 2026-08-06 Actions incident a push landed with no
  # run created, and with no dispatch there was no way to start one short of
  # manufacturing an empty commit.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write   # create version-bump commits and tags
  packages: read    # read @bambiste build tooling from GitHub Packages
  id-token: write   # npm publish provenance (OIDC)
  pull-requests: write  # open/update the "Version Packages" PR
  actions: read     # required by the reusable CI gate (nx-set-shas / nx affected)

jobs:
  # Gate: build + test + typecheck must be green before we version/publish.
  # On a "Version Packages" push this just defers opening the PR until green;
  # on a publish push (PR merged) it blocks `pnpm release` if anything is red.
  # Inlined (not a reusable-workflow call) for predictable startup/permissions.
  test-gate:
    name: CI gate (build + test + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Registry routing/auth comes from the repo .npmrc (@fluixi → npm, @bambiste
      # → GitHub Packages). NODE_AUTH_TOKEN authenticates the @bambiste install.
      # Write auth to the user ~/.npmrc — pnpm v10 ignores _authToken lines in the
      # committed project .npmrc, so credentials must come from a trusted source.
      # GitHub Packages (@bambiste) install + npm (@fluixi) publish.
      - name: Configure registry auth
        run: |
          {
            echo "//npm.pkg.github.com/:_authToken=${GH_PKG_TOKEN}"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          } >> ~/.npmrc
        env:
          GH_PKG_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the publishable packages topologically. Each lib's build runs
      # `tsc` for its typings, so a successful build is also the typecheck gate.
      - name: Build packages
        run: pnpm run build
        env:
          NODE_ENV: production

      # Run tests via pnpm (NOT `nx run-many`) scoped to the publishable
      # `./packages/*`. nx loads the whole workspace project graph, which chokes
      # on a nested scaffolding template (packages/create/template-spa/vite.config.ts);
      # pnpm only runs each package's `test` script and never touches that config.
      #
      # Exclusion: @fluixi/cli has a `test` script but no test files, so
      # `vitest run` exits 1 ("no test files"). Re-include once it has tests.
      - name: Test
        run: pnpm -r --filter "./packages/*" --filter "!@fluixi/cli" test

  release:
    name: Version or publish
    needs: test-gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT so the changeset-release branch is pushed as a real user,
          # which lets the PR be created even when the org blocks Actions from it.
          token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # NOTE: no `registry-url` here on purpose — it writes a temp .npmrc via
      # NPM_CONFIG_USERCONFIG that authenticates npm with NODE_AUTH_TOKEN (the GitHub
      # PAT), overriding the per-registry tokens the "Configure registry auth" step
      # writes to ~/.npmrc. Dual-registry auth (npm + GitHub Packages) must come from
      # ~/.npmrc. (Re-add registry-url only alongside npm provenance, once public.)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # @bambiste/mix-builder lives on GitHub Packages under a personal account, so
      # the repo-scoped GITHUB_TOKEN can't read it. PACKAGES_TOKEN is a classic PAT
      # with read:packages (for @bambiste). Falls back to GITHUB_TOKEN when unset.
      # Registry routing is driven by the repo .npmrc.
      # Write auth to the user ~/.npmrc — pnpm v10 ignores _authToken lines in the
      # committed project .npmrc, so credentials must come from a trusted source.
      # GitHub Packages (@bambiste) install + npm (@fluixi) publish.
      - name: Configure registry auth
        run: |
          {
            echo "//npm.pkg.github.com/:_authToken=${GH_PKG_TOKEN}"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          } >> ~/.npmrc
        env:
          GH_PKG_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The changesets action does one of two things:
      #   1. Pending changesets present → opens/updates a "Version Packages" PR
      #      that bumps package.json versions and writes CHANGELOGs
      #   2. "Version Packages" PR just merged (no changesets left) → runs
      #      `pnpm release` (build + `changeset publish`) → publishes to npm.
      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          # GITHUB_TOKEN: git ops + opening the "Version Packages" PR. PACKAGES_TOKEN
          # (real-user PAT) lets the PR be created even when the org disables
          # "Allow GitHub Actions to create and approve PRs"; falls back to GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN: reads @bambiste (GitHub Packages) during the build.
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: publishes @fluixi/* + create-fluixi to public npm (repo .npmrc).
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance: enable ONLY after the repo is public (it hard-fails on a
          # private repo). Uncomment once visibility is flipped:
          # NPM_CONFIG_PROVENANCE: true

      # `changeset publish` puts prerelease versions on the npm `latest` tag but a
      # brand-new package (no stable release) lands on `latest` only, leaving its
      # prerelease dist-tag (`alpha`/`next`) stale — so `@fluixi/x@alpha` resolves the
      # OLD version. Reconcile every publishable package's `<tag>` to the version on
      # npm.
      #
      # Runs on `!cancelled()` — NOT gated on the changesets step succeeding — because
      # the npm publish happens BEFORE the action's git-tag push, so a failed tag push
      # (which reds the step) must not skip this. Independent of the action's
      # `publishedPackages` output (unset on a failed step): reads each workspace
      # package's local version and repoints `<tag>` when that exact version is on npm.
      # No-op outside pre mode and on version-PR-only pushes; self-heals a stale tag on
      # the next push.
      - name: Advance prerelease dist-tag
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f .changeset/pre.json ]; then
            echo "Not in pre mode — latest is authoritative; nothing to do."; exit 0
          fi
          tag="$(jq -r '.tag // empty' .changeset/pre.json)"
          if [ -z "$tag" ]; then
            echo "No pre-mode tag found — skipping."; exit 0
          fi
          for pkgjson in packages/*/package.json; do
            name="$(jq -r '.name // empty' "$pkgjson")"
            version="$(jq -r '.version // empty' "$pkgjson")"
            private="$(jq -r '.private // false' "$pkgjson")"
            [ -z "$name" ] || [ -z "$version" ] && continue
            [ "$private" = "true" ] && continue
            # Only prerelease versions of THIS pre-mode tag (e.g. 1.2.3-alpha.4).
            case "$version" in *-"$tag".*) ;; *) continue ;; esac
            # Only if that exact version is actually published.
            npm view "${name}@${version}" version >/dev/null 2>&1 || continue
            current="$(npm dist-tag ls "$name" 2>/dev/null | awk -F': ' -v t="$tag" '$1==t {print $2}')"
            if [ "$current" != "$version" ]; then
              echo "Repointing ${name}@${tag}: ${current:-<none>} -> ${version}"
              npm dist-tag add "${name}@${version}" "$tag" || echo "  (dist-tag add failed — continuing)"
            else
              echo "${name}@${tag} already at ${version}"
            fi
          done
