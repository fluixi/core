name: Release

# Runs on every push to main (stable) and next (prerelease).
# - If there are pending changesets  → opens/updates a "Version Packages" PR
# - If the "Version Packages" PR was just merged → builds & publishes
# On `next`, changesets is in prerelease mode (.changeset/pre.json, tag `next`),
# so versions are `-next.X` and publish under the npm `next` dist-tag — separate
# from the stable `latest` line on main.
on:
  push:
    branches: [main, next, alpha]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write   # create version-bump commits and tags
  packages: write   # publish to GitHub Packages
  pull-requests: write  # open/update the "Version Packages" PR

jobs:
  # Gate: build + test + typecheck must be green before we version/publish.
  # On a "Version Packages" push this just defers opening the PR until green;
  # on a publish push (PR merged) it blocks `pnpm release` if anything is red.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Version or publish
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT so the changeset-release branch is pushed as a real user,
          # which lets the PR be created even when the org blocks Actions from it.
          token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@fluixi'

      # @bambiste/mix-builder lives under a personal account, so the repo-scoped
      # GITHUB_TOKEN can't read it. PACKAGES_TOKEN is a classic PAT with
      # read:packages (for @bambiste + @fluixi) and write:packages (to publish
      # @fluixi). Falls back to GITHUB_TOKEN when the secret isn't set.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # The changesets action does one of two things:
      #   1. Pending changesets present → opens/updates a "Version Packages" PR
      #      that bumps package.json versions and writes CHANGELOGs
      #   2. "Version Packages" PR just merged (no changesets left) → runs
      #      `pnpm release` which builds then publishes to GitHub Packages
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          # PACKAGES_TOKEN = classic PAT (repo + read:packages + write:packages).
          # As a real-user token it can open the "Version Packages" PR even when
          # the org disables "Allow GitHub Actions to create and approve PRs".
          # Falls back to GITHUB_TOKEN when the secret isn't set.
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
