# ─── Leuzman Full Stack — LOCAL / CI only ─────────────────────────────────────
#
# FOR LOCAL DEVELOPMENT only — requires the full monorepo.
# VPS deployment: use each project's own docker-compose.yml instead.
#
# Builds all services from monorepo source in a single command:
#   postgres · redis · medusa backend · storefront · store-admin
#
# ── Quick start ───────────────────────────────────────────────────────────────
#   pnpm docker:up                    # full stack
#   pnpm docker:backend               # postgres + redis + medusa only
#   pnpm docker:frontend              # storefront + store-admin only
#   docker compose logs -f medusa     # follow backend logs
#   pnpm docker:down                  # stop (keeps DB volume)
#   pnpm docker:reset                 # stop + wipe DB
#
# ── Env vars ──────────────────────────────────────────────────────────────────
#   Edit .env.docker at the repo root (or copy → .env.docker.local for secrets)
#
# ── Service URLs ──────────────────────────────────────────────────────────────
#   Medusa API / Admin  →  http://localhost:9000
#   Storefront          →  http://localhost:3003
#   Store Admin         →  http://localhost:3004
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: leuzman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-medusa-store}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - leuzman_network
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medusa-store}"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 15s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: leuzman_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - leuzman_network
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  # ── Medusa Backend ─────────────────────────────────────────────────────────
  medusa:
    build:
      context: .
      dockerfile: packages/kettle-apps/leuzman-backend/Dockerfile.repo
    container_name: leuzman_medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - packages/kettle-apps/leuzman-backend/.env.docker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa-store}
      REDIS_URL:    redis://redis:6379
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    networks:
      - leuzman_network

  # ── Storefront ─────────────────────────────────────────────────────────────
  storefront:
    build:
      context: .
      dockerfile: packages/kettle-apps/storefront/Dockerfile
      args:
        VITE_MEDUSA_URL:      ${VITE_MEDUSA_URL:-http://localhost:9000}
        VITE_PUBLISHABLE_KEY: ${VITE_PUBLISHABLE_KEY:-}
    container_name: leuzman_storefront
    restart: unless-stopped
    ports:
      - "${STOREFRONT_PORT:-3003}:80"
    networks:
      - leuzman_network

  # ── Store Admin ────────────────────────────────────────────────────────────
  store-admin:
    build:
      context: .
      dockerfile: packages/kettle-apps/store-admin/Dockerfile
      args:
        VITE_MEDUSA_URL:      ${VITE_MEDUSA_URL:-http://localhost:9000}
        VITE_PUBLISHABLE_KEY: ${VITE_PUBLISHABLE_KEY:-}
    container_name: leuzman_store_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3004}:80"
    networks:
      - leuzman_network

volumes:
  postgres_data:
    name: leuzman_postgres_data

networks:
  leuzman_network:
    name: leuzman_network
    driver: bridge
